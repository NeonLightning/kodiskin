name: Update Kodi Repository

on:
  push:
    branches:
      - main
    paths:
      - 'skin.*/**'
      - 'scripts/update_repo.py'
      - '.github/workflows/update-repo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate repository index
        run: python3 scripts/update_repo.py

      - name: Commit repository metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add addons.xml addons.xml.md5

          if ! git diff --cached --quiet; then
            git commit -m "Update Kodi repository index"
            git push
          fi
